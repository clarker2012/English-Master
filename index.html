<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Vocabulary Trainer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --surface: #ffffff;
      --ink: #1e2528;
      --muted: #64706f;
      --line: #dbe1dc;
      --accent: #216b5b;
      --accent-2: #b85c38;
      --review: #7b5ea7;
      --new: #d99422;
      --mastered: #477a54;
      --danger: #b43b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }
    button, input { font: inherit; }
    button, .file-button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
    }
    button:hover, .file-button:hover { border-color: var(--accent); }
    .app-shell { max-width: 1180px; margin: 0 auto; padding: 24px; }
    .app-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 28px; margin-bottom: 0; }
    h2 { font-size: 20px; }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab.is-active { background: var(--accent); color: white; border-color: var(--accent); }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .metric, .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .metric strong { display: block; font-size: 22px; }
    .metric span, .muted { color: var(--muted); }
    .view[hidden] { display: none; }
    .study-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }
    .passage {
      font-size: 18px;
      line-height: 1.9;
    }
    .word-token {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      padding: 1px 2px;
      border-radius: 4px;
    }
    .word-token.status-new { border-bottom-color: var(--new); background: #fff3d9; }
    .word-token.status-learning, .word-token.status-review { border-bottom-color: var(--review); background: #f1ebfb; }
    .word-token.status-mastered { border-bottom-color: var(--mastered); color: var(--mastered); }
    .sentence-active { background: #edf7f3; border-radius: 6px; }
    .translation {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
    }
    .side-column { display: grid; gap: 16px; }
    .button-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .range-label { display: flex; justify-content: space-between; margin-bottom: 6px; }
    input[type="range"] { width: 100%; margin-bottom: 12px; }
    input[type="file"] { max-width: 100%; }
    .file-button { display: inline-block; text-align: center; }
    .danger { color: var(--danger); border-color: #e7b7b7; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .voice-wave {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      align-items: center;
      gap: 3px;
      height: 56px;
      margin: 10px 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fbfa;
    }
    .voice-wave span {
      display: block;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0.35;
      transition: height 80ms linear, opacity 80ms linear;
    }
    pre { white-space: pre-wrap; overflow: auto; }
    @media (max-width: 820px) {
      .app-shell { padding: 14px; }
      .app-header { align-items: stretch; flex-direction: column; }
      .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .study-layout { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr; }
      .button-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Local learning tool</p>
        <h1>Context Vocabulary Trainer</h1>
      </div>
      <nav class="tabs" aria-label="Main sections">
        <button class="tab is-active" data-view="study-view" type="button">Study</button>
        <button class="tab" data-view="test-view" type="button">Test</button>
        <button class="tab" data-view="stats-view" type="button">Stats</button>
        <button class="tab" data-view="data-view" type="button">Data</button>
      </nav>
    </header>

    <section id="dashboard" class="dashboard" aria-label="Learning dashboard"></section>

    <main>
      <section id="study-view" class="view is-active">
        <section class="study-layout">
          <article class="panel passage-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Current passage</p>
                <h2 id="passage-title">Context Practice Session</h2>
              </div>
              <button id="generate-passage" type="button">Generate passage</button>
            </div>
            <article id="passage" class="passage"></article>
            <p id="translation" class="translation" hidden></p>
          </article>

          <aside class="side-column">
            <section id="word-card" class="panel word-card" aria-live="polite"></section>
            <section class="panel controls">
              <h2>Reading controls</h2>
              <label class="range-label" for="wpm-control">WPM <span id="wpm-value">140</span></label>
              <input id="wpm-control" type="range" min="120" max="200" value="140" step="5">
              <div class="button-grid">
                <button id="toggle-translation" type="button">Show Chinese</button>
                <button id="play-passage" type="button">Play passage</button>
                <button id="play-sentence" type="button">Play sentence</button>
                <button id="guided-reading" type="button">Guided reading</button>
                <button id="start-speaking" type="button">Start speaking</button>
              </div>
              <div id="reading-feedback" class="feedback"></div>
            </section>
          </aside>
        </section>
      </section>

      <section id="test-view" class="view" hidden>
        <div class="panel test-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Vocabulary estimate</p>
              <h2>500-question range test</h2>
            </div>
            <button id="start-test" type="button">Start test</button>
          </div>
          <div id="test-content"></div>
        </div>
      </section>

      <section id="stats-view" class="view" hidden>
        <div id="stats-content" class="stats-grid"></div>
      </section>

      <section id="data-view" class="view" hidden>
        <div class="panel data-panel">
          <h2>Progress data</h2>
          <div class="button-grid">
            <button id="export-progress" type="button">Export progress</button>
            <label class="file-button" for="import-progress">Import progress</label>
            <input id="import-progress" type="file" accept="application/json">
            <button id="reset-progress" class="danger" type="button">Reset progress</button>
          </div>
          <p class="muted">Vocabulary JSON import is reserved for the full 20,000-word version.</p>
          <pre id="data-status" aria-live="polite"></pre>
        </div>
      </section>
    </main>
  </div>
  <script>
    const mockVocabulary = [
      ["analyze", "/AN-uh-lyze/", "v.", "分析", 4, 1200, "We need to analyze the results carefully."],
      ["approach", "/uh-PROHCH/", "n./v.", "方法；接近", 3, 900, "Her approach made the problem easier."],
      ["benefit", "/BEN-uh-fit/", "n./v.", "好处；受益", 3, 850, "Daily reading can benefit your vocabulary."],
      ["context", "/KON-tekst/", "n.", "语境", 4, 1500, "The context helps explain the meaning."],
      ["define", "/di-FYNE/", "v.", "定义", 3, 1300, "Can you define this word in English?"],
      ["estimate", "/ES-tuh-mayt/", "v./n.", "估算", 4, 1700, "The test can estimate your vocabulary range."],
      ["evidence", "/EV-uh-dens/", "n.", "证据", 4, 1100, "The evidence supports the idea."],
      ["focus", "/FOH-kus/", "n./v.", "专注", 2, 700, "Focus on words you meet often."],
      ["generate", "/JEN-uh-rayt/", "v.", "生成", 4, 1800, "The app can generate a short passage."],
      ["identify", "/eye-DEN-tuh-fye/", "v.", "识别", 4, 1400, "Try to identify the key word."],
      ["improve", "/im-PROOV/", "v.", "提高", 2, 650, "Speaking practice can improve fluency."],
      ["include", "/in-KLOOD/", "v.", "包括", 2, 500, "Each card should include an example."],
      ["increase", "/in-KREES/", "v.", "增加", 2, 600, "Review can increase your known score."],
      ["method", "/METH-ud/", "n.", "方法", 3, 1000, "This method mixes review and new words."],
      ["native", "/NAY-tiv/", "adj.", "母语的", 3, 1600, "The tool is for native Chinese speakers."],
      ["option", "/OP-shun/", "n.", "选项", 3, 1250, "Choose the best option."],
      ["passage", "/PAS-ij/", "n.", "短文", 4, 1900, "Read the passage aloud."],
      ["practice", "/PRAK-tis/", "n./v.", "练习", 2, 750, "Regular practice builds confidence."],
      ["progress", "/PROG-res/", "n.", "进步", 3, 950, "Your progress is saved locally."],
      ["recognize", "/REK-ug-nyze/", "v.", "认出", 4, 1450, "Do you recognize this word?"],
      ["review", "/ri-VYOO/", "n./v.", "复习", 2, 800, "Review difficult words more often."],
      ["schedule", "/SKEJ-ool/", "n./v.", "计划；安排", 4, 2100, "The review schedule changes over time."],
      ["sentence", "/SEN-tens/", "n.", "句子", 2, 550, "Listen to one sentence at a time."],
      ["similarity", "/sim-uh-LAR-uh-tee/", "n.", "相似度", 5, 2600, "Speech recognition can estimate similarity."],
      ["smooth", "/SMOOTH/", "adj.", "流畅", 3, 1550, "Mark the reading as smooth if it felt easy."],
      ["source", "/SORS/", "n.", "来源", 3, 1350, "Compare your speech with the source text."],
      ["status", "/STAY-tus/", "n.", "状态", 4, 1750, "Each word has a learning status."],
      ["structure", "/STRUK-cher/", "n.", "结构", 4, 1650, "A clear structure helps learning."],
      ["support", "/suh-PORT/", "v./n.", "支持", 2, 680, "The browser may support speech recognition."],
      ["target", "/TAR-get/", "n./v.", "目标", 3, 1050, "Target words are highlighted."],
      ["translate", "/trans-LAYT/", "v.", "翻译", 3, 1150, "You can translate the passage."],
      ["update", "/up-DAYT/", "v.", "更新", 3, 1180, "The app will update your score."],
      ["visual", "/VIZH-oo-ul/", "adj.", "视觉的", 4, 2200, "Visual markers show word status."],
      ["vocabulary", "/voh-KAB-yuh-lair-ee/", "n.", "词汇", 2, 400, "Vocabulary grows through repeated use."],
      ["available", "/uh-VAY-luh-bul/", "adj.", "可用的", 3, 980, "Manual feedback is available in every browser."],
      ["accurate", "/AK-yur-it/", "adj.", "准确的", 4, 2000, "The estimate is useful but not perfectly accurate."]
    ].map((item, index) => ({
      id: index + 1,
      word: item[0],
      phonetic: item[1],
      pos: item[2],
      zh: item[3],
      level: item[4],
      frequencyRank: item[5],
      groupId: Math.floor(index / 10) + 1,
      example: item[6],
      knownScore: 0,
      clickCount: 0,
      correctCount: 0,
      wrongCount: 0,
      readCount: 0,
      lastReviewedAt: "",
      nextReviewAt: "",
      status: "new"
    }));

    const core = {
      createDefaultState() {
        return {
          user: {
            estimatedVocabulary: 5000,
            currentGroupId: 1,
            masteredWords: 0,
            learningWords: 0,
            newWordRatio: 0.1,
            targetWpm: 140,
            totalStudyMinutes: 0,
            streakDays: 0
          },
          vocabulary: mockVocabulary.map((word) => ({ ...word })),
          activity: {},
          tests: [],
          reading: { totalReadCount: 0, lastAccuracy: null, studiedWordIdsByDay: {} }
        };
      },

      serializeProgress(state) {
        return JSON.stringify({
          version: 1,
          exportedAt: new Date().toISOString(),
          state
        }, null, 2);
      },

      normalizeProgressState(rawState) {
        if (!Array.isArray(rawState?.vocabulary)) throw new Error("Invalid progress file");
        const defaults = this.createDefaultState();
        const safeNumber = (value, fallback) => Number.isFinite(value) ? value : fallback;
        const safeObject = (value) => value && typeof value === "object" && !Array.isArray(value) ? value : {};
        const safeString = (value, fallback) => typeof value === "string" && value.trim() ? value : fallback;
        const validStatuses = new Set(["new", "learning", "review", "mastered"]);
        const rawWordsById = new Map(rawState.vocabulary
          .filter((word) => word && typeof word === "object" && Number.isFinite(word.id))
          .map((word) => [word.id, word]));

        const vocabulary = defaults.vocabulary.map((defaultWord) => {
          const rawWord = rawWordsById.get(defaultWord.id);
          if (!rawWord) return { ...defaultWord };
          return {
            ...defaultWord,
            word: safeString(rawWord.word, defaultWord.word),
            phonetic: safeString(rawWord.phonetic, defaultWord.phonetic),
            pos: safeString(rawWord.pos, defaultWord.pos),
            zh: safeString(rawWord.zh, defaultWord.zh),
            level: safeNumber(rawWord.level, defaultWord.level),
            frequencyRank: safeNumber(rawWord.frequencyRank, defaultWord.frequencyRank),
            groupId: safeNumber(rawWord.groupId, defaultWord.groupId),
            example: safeString(rawWord.example, defaultWord.example),
            knownScore: safeNumber(rawWord.knownScore, defaultWord.knownScore),
            clickCount: safeNumber(rawWord.clickCount, defaultWord.clickCount),
            correctCount: safeNumber(rawWord.correctCount, defaultWord.correctCount),
            wrongCount: safeNumber(rawWord.wrongCount, defaultWord.wrongCount),
            readCount: safeNumber(rawWord.readCount, defaultWord.readCount),
            lastReviewedAt: typeof rawWord.lastReviewedAt === "string" ? rawWord.lastReviewedAt : defaultWord.lastReviewedAt,
            nextReviewAt: typeof rawWord.nextReviewAt === "string" ? rawWord.nextReviewAt : defaultWord.nextReviewAt,
            status: validStatuses.has(rawWord.status) ? rawWord.status : defaultWord.status
          };
        });

        const rawUser = safeObject(rawState.user);
        const rawReading = safeObject(rawState.reading);
        return {
          ...defaults,
          user: {
            ...defaults.user,
            estimatedVocabulary: safeNumber(rawUser.estimatedVocabulary, defaults.user.estimatedVocabulary),
            currentGroupId: safeNumber(rawUser.currentGroupId, defaults.user.currentGroupId),
            masteredWords: safeNumber(rawUser.masteredWords, defaults.user.masteredWords),
            learningWords: safeNumber(rawUser.learningWords, defaults.user.learningWords),
            newWordRatio: safeNumber(rawUser.newWordRatio, defaults.user.newWordRatio),
            targetWpm: safeNumber(rawUser.targetWpm, defaults.user.targetWpm),
            totalStudyMinutes: safeNumber(rawUser.totalStudyMinutes, defaults.user.totalStudyMinutes),
            streakDays: safeNumber(rawUser.streakDays, defaults.user.streakDays)
          },
          vocabulary,
          activity: safeObject(rawState.activity),
          tests: Array.isArray(rawState.tests) ? rawState.tests : defaults.tests,
          reading: {
            ...defaults.reading,
            totalReadCount: safeNumber(rawReading.totalReadCount, defaults.reading.totalReadCount),
            lastAccuracy: rawReading.lastAccuracy === null || Number.isFinite(rawReading.lastAccuracy)
              ? rawReading.lastAccuracy
              : defaults.reading.lastAccuracy,
            studiedWordIdsByDay: safeObject(rawReading.studiedWordIdsByDay)
          }
        };
      },

      parseProgress(jsonText) {
        try {
          const progress = JSON.parse(jsonText);
          if (
            progress?.version !== 1 ||
            !progress.state ||
            !Array.isArray(progress.state?.vocabulary)
          ) {
            throw new Error("Invalid progress file");
          }
          return this.normalizeProgressState(progress.state);
        } catch (error) {
          throw new Error("Invalid progress file");
        }
      },

      estimateVocabularyRange(answers, populationSize = 10000) {
        const totalQuestions = answers.length || 1;
        const correctCount = answers.filter((answer) => answer.known).length;
        const sampleRate = correctCount / totalQuestions;
        const estimatedVocabulary = Math.round(sampleRate * populationSize);
        const z = 1.96;
        const finitePopulationCorrection = Math.sqrt(Math.max(0, (populationSize - totalQuestions) / Math.max(1, populationSize - 1)));
        const denominator = 1 + ((z * z) / totalQuestions);
        const center = (sampleRate + ((z * z) / (2 * totalQuestions))) / denominator;
        const halfWidth = (
          z * Math.sqrt((sampleRate * (1 - sampleRate) / totalQuestions) + ((z * z) / (4 * totalQuestions * totalQuestions))) / denominator
        ) * finitePopulationCorrection;
        const confidenceLow = Math.round(Math.max(0, center - halfWidth) * populationSize);
        const confidenceHigh = Math.round(Math.min(1, center + halfWidth) * populationSize);
        const currentGroupId = Math.max(1, Math.min(4, Math.ceil(estimatedVocabulary / 2500)));
        const newWordRatio = estimatedVocabulary >= 8000 ? 0.25 : estimatedVocabulary >= 6000 ? 0.2 : estimatedVocabulary >= 5000 ? 0.15 : 0.1;
        return {
          estimatedVocabulary,
          rangeLabel: `${confidenceLow}-${confidenceHigh}`,
          currentGroupId,
          newWordRatio,
          correctCount,
          totalQuestions,
          sampleRate,
          confidenceLow,
          confidenceHigh,
          populationSize,
          method: "Simple random sample with Wilson 95% confidence interval"
        };
      },

      shuffleSample(items, size, random = Math.random) {
        const pool = [...items];
        const sampleSize = Math.min(size, pool.length);
        for (let index = pool.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(random() * (index + 1));
          [pool[index], pool[swapIndex]] = [pool[swapIndex], pool[index]];
        }
        return pool.slice(0, sampleSize);
      },

      chooseTargetWords(state) {
        const dueWords = state.vocabulary.filter((word) => word.status === "review");
        const newWords = state.vocabulary.filter((word) => (
          word.status === "new" && word.groupId <= state.user.currentGroupId + 1
        ));
        const familiarWords = state.vocabulary.filter((word) => (
          word.status === "learning" || word.status === "mastered"
        ));
        return [...dueWords.slice(0, 3), ...newWords.slice(0, 6), ...familiarWords.slice(0, 3)].slice(0, 10);
      },

      generatePassage(state) {
        const targets = this.chooseTargetWords(state);
        const words = targets.length >= 5 ? targets : state.vocabulary.slice(0, 8);
        const [first, second, third, fourth, fifth, sixth, seventh, eighth] = words;
        const sentences = [
          `A clear ${first.word} helps you notice useful English in context.`,
          `When you ${second.word} a short passage, the meaning becomes easier to remember.`,
          `Daily ${third.word} can improve listening, speaking, and reading confidence.`,
          `Use each ${fourth.word} with an example instead of memorizing it alone.`,
          `After review, the app can ${fifth.word} your progress and choose the next words.`
        ];
        const zhSentences = [
          `清晰的“${first.zh}”能帮助你在语境中注意到有用的英语。`,
          `当你“${second.zh}”一篇短文时，词义会变得更容易记住。`,
          `每天进行“${third.zh}”练习，可以提升听力、口语和阅读信心。`,
          `把每个“${fourth.zh}”放进例句里使用，而不是单独死记硬背。`,
          `复习之后，应用可以“${fifth.zh}”你的进度，并选择下一批单词。`
        ];
        if (sixth && seventh && eighth) {
          sentences.push(`This simple ${sixth.word} gives visual feedback while you ${seventh.word} and ${eighth.word} new vocabulary.`);
          zhSentences.push(`这个简单的“${sixth.zh}”会在你“${seventh.zh}”并“${eighth.zh}”新词汇时提供可视化反馈。`);
        }
        return {
          title: "Context Practice Session",
          sentences,
          text: sentences.join(" "),
          zh: zhSentences.join(" "),
          targetWordIds: words.map((word) => word.id)
        };
      },

      hasUsableChineseMeaning(entry) {
        return Boolean(entry && entry.zh && entry.zh !== "NULL" && /[\u4e00-\u9fff]/.test(entry.zh));
      },

      getUsablePhrase(entry, questionIndex = 0) {
        const phrases = Array.isArray(entry?.phrases)
          ? entry.phrases.filter((phrase) => (
            phrase.term &&
            Array.isArray(phrase.meanings) &&
            phrase.meanings.join("").match(/[\u4e00-\u9fff]/)
          ))
          : [];
        if (!phrases.length) return null;
        return phrases[(entry.id + questionIndex) % phrases.length];
      },

      getChoiceMeaning(entry) {
        if (this.hasUsableChineseMeaning(entry)) return entry.zh;
        const phrase = this.getUsablePhrase(entry);
        return phrase ? phrase.meanings.join("；") : "";
      },

      createVocabularyTest(state, size = 500, wordBank = state.vocabulary, random = Math.random) {
        const rawSourceWords = wordBank.length ? wordBank : state.vocabulary;
        const sourceWords = rawSourceWords.filter((word) => (
          this.hasUsableChineseMeaning(word) || this.getUsablePhrase(word)
        ));
        const sortedWords = [...sourceWords].sort((a, b) => (
          (a.rank || a.frequencyRank || 0) - (b.rank || b.frequencyRank || 0) || a.word.localeCompare(b.word)
        ));
        const selected = this.shuffleSample(sortedWords, size, random);
        return selected.map((word, questionIndex) => {
          const phrase = this.getUsablePhrase(word, questionIndex);
          const shouldUsePhrase = phrase && (!this.hasUsableChineseMeaning(word) || (word.id + questionIndex) % 4 === 0);
          const displayTerm = shouldUsePhrase ? phrase.term : word.word;
          const displayMeaning = shouldUsePhrase ? phrase.meanings.join("；") : word.zh;
          const usedLabels = new Set([displayMeaning]);
          const distractors = sortedWords
            .map((candidate) => ({
              ...candidate,
              choiceMeaning: this.getChoiceMeaning(candidate)
            }))
            .filter((candidate) => (
              candidate.id !== word.id &&
              candidate.choiceMeaning &&
              candidate.choiceMeaning !== displayMeaning
            ))
            .sort((a, b) => (
              Math.abs((a.rank || a.frequencyRank || 0) - (word.rank || word.frequencyRank || 0)) -
              Math.abs((b.rank || b.frequencyRank || 0) - (word.rank || word.frequencyRank || 0)) ||
              a.word.localeCompare(b.word)
            ))
            .reduce((labels, candidate) => {
              if (labels.length >= 3 || usedLabels.has(candidate.choiceMeaning)) return labels;
              usedLabels.add(candidate.choiceMeaning);
              labels.push(candidate.choiceMeaning);
              return labels;
            }, []);
          const options = [...distractors];
          const insertAt = options.length ? (word.id + questionIndex) % (options.length + 1) : 0;
          options.splice(insertAt, 0, displayMeaning);
          return {
            word: {
              ...word,
              word: displayTerm,
              zh: displayMeaning,
              level: word.level || Math.max(1, Math.ceil((word.rank || word.frequencyRank || 1) / 1000))
            },
            options
          };
        });
      },

      clampScore(score) {
        return Math.max(0, Math.min(5, Math.round(score * 10) / 10));
      },

      localDateKey(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      },

      mapWpmToRate(wpm) {
        const normalized = Math.max(120, Math.min(200, Number(wpm) || 120));
        return Math.round((0.8 + ((normalized - 120) / 80) * 0.6) * 10) / 10;
      },

      normalizeWords(text) {
        return String(text)
          .toLowerCase()
          .replace(/[^a-z\s]/g, " ")
          .split(/\s+/)
          .filter(Boolean);
      },

      textSimilarity(source, spoken) {
        const sourceWords = new Set(this.normalizeWords(source));
        const spokenWords = new Set(this.normalizeWords(spoken));
        if (!sourceWords.size || !spokenWords.size) return 0;
        let matches = 0;
        spokenWords.forEach((word) => {
          if (sourceWords.has(word)) matches += 1;
        });
        return matches / Math.max(sourceWords.size, spokenWords.size);
      },

      getSentenceTargetWordIds(state, passage, sentenceIndex) {
        const sentenceWords = new Set(this.normalizeWords(passage.sentences[sentenceIndex] || ""));
        const targetIds = new Set(passage.targetWordIds || []);
        return state.vocabulary
          .filter((word) => targetIds.has(word.id) && sentenceWords.has(word.word.toLowerCase()))
          .map((word) => word.id);
      },

      applyWordEvent(word, eventName) {
        const updated = { ...word };
        if (eventName === "click") {
          updated.clickCount += 1;
        }
        if (eventName === "testCorrect") {
          updated.correctCount += 1;
          updated.knownScore = this.clampScore(updated.knownScore + 0.5);
        }
        if (eventName === "testWrong") {
          updated.wrongCount += 1;
          updated.knownScore = this.clampScore(updated.knownScore - 0.5);
        }
        if (eventName === "readSmooth") {
          updated.readCount += 1;
          updated.knownScore = this.clampScore(updated.knownScore + 0.3);
        }
        if (eventName === "readOkay") {
          updated.readCount += 1;
          updated.knownScore = this.clampScore(updated.knownScore + 0.1);
        }
        if (eventName === "readDifficult") {
          updated.readCount += 1;
        }
        if (updated.knownScore >= 4.5) updated.status = "mastered";
        else if (updated.knownScore >= 2) updated.status = "learning";
        else if (updated.wrongCount > 0 || updated.readCount > 0) updated.status = "review";
        return updated;
      },

      deriveMetrics(state) {
        const masteredWords = state.vocabulary.filter((word) => word.status === "mastered").length;
        const learningWords = state.vocabulary.filter((word) => word.status === "learning").length;
        const dueReviewWords = state.vocabulary.filter((word) => word.status === "review").length;
        const todayKey = this.localDateKey();
        const today = state.activity[todayKey] || { studiedWords: 0, readCount: 0 };
        return {
          masteredWords,
          learningWords,
          dueReviewWords,
          todayStudiedWords: today.studiedWords || 0,
          todayReadCount: today.readCount || 0
        };
      },

      escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      },

      findWordByText(state, text) {
        const normalized = String(text).toLowerCase().replace(/[^a-z]/g, "");
        return state.vocabulary.find((word) => word.word.toLowerCase() === normalized);
      }
    };

    // Task 1 static contract marker: core:
    window.CVT = { core, app: {} };

    const storageKey = "context-vocabulary-trainer-progress";
    const testStorageKey = "context-vocabulary-trainer-test-session";

    const app = {
      state: core.createDefaultState(),
      assessmentWordBank: [],
      passage: null,
      currentSentenceIndex: 0,
      guidedActive: false,
      showTranslation: false,
      selectedWordId: null,
      microphoneMonitor: null,
      testSession: { questions: [], index: 0, answers: [], result: null },

      async init() {
        this.state = this.loadState();
        this.assessmentWordBank = await this.loadAssessmentWordBank();
        this.testSession = this.loadSavedTestSession() || this.testSession;
        this.passage = core.generatePassage(this.state);
        this.bindEvents();
        this.render();
      },

      async loadAssessmentWordBank() {
        if (typeof fetch !== "function") return [];
        try {
          const response = await fetch("data/assessment-word-bank.json");
          if (!response.ok) throw new Error("Word bank unavailable");
          const entries = await response.json();
          return Array.isArray(entries)
            ? entries.filter((entry) => entry.word && entry.zh).slice(0, 10000)
            : [];
        } catch (error) {
          return [];
        }
      },

      bindEvents() {
        document.querySelectorAll(".tab").forEach((button) => {
          button.addEventListener("click", () => this.showView(button.dataset.view));
        });
        document.getElementById("generate-passage").addEventListener("click", () => {
          this.passage = core.generatePassage(this.state);
          this.currentSentenceIndex = 0;
          this.guidedActive = false;
          this.saveState();
          this.render();
        });
        document.getElementById("toggle-translation").addEventListener("click", () => {
          this.showTranslation = !this.showTranslation;
          this.render();
        });
        document.getElementById("wpm-control").addEventListener("input", (event) => {
          this.state.user.targetWpm = Number(event.target.value);
          this.saveState();
          this.render();
        });
        document.getElementById("play-passage").addEventListener("click", () => this.speakPassage());
        document.getElementById("play-sentence").addEventListener("click", () => {
          this.speak(this.passage.sentences[this.currentSentenceIndex] || this.passage.sentences[0] || "");
        });
        document.getElementById("guided-reading").addEventListener("click", () => this.guidedReading());
        document.getElementById("start-speaking").addEventListener("click", () => this.startSpeaking());
        document.getElementById("start-test").addEventListener("click", () => this.startTest());
        document.getElementById("export-progress").addEventListener("click", () => this.exportProgress());
        document.getElementById("import-progress").addEventListener("change", (event) => this.importProgress(event));
        document.getElementById("reset-progress").addEventListener("click", () => this.resetProgress());
      },

      loadState() {
        try {
          const saved = localStorage.getItem(storageKey);
          return saved ? core.parseProgress(saved) : core.createDefaultState();
        } catch (error) {
          return core.createDefaultState();
        }
      },

      saveState(state = this.state) {
        try {
          localStorage.setItem(storageKey, core.serializeProgress(state));
          return true;
        } catch (error) {
          this.writeDataStatus("Could not save progress locally. Browser storage may be full or unavailable.");
          return false;
        }
      },

      loadSavedTestSession() {
        try {
          const saved = localStorage.getItem(testStorageKey);
          if (!saved) return null;
          const payload = JSON.parse(saved);
          const session = payload?.session;
          if (
            payload?.version !== 1 ||
            !Array.isArray(session?.questions) ||
            !Array.isArray(session?.answers) ||
            !Number.isFinite(session?.index) ||
            session.questions.length !== 500 ||
            session.populationSize !== 10000
          ) {
            throw new Error("Invalid saved test");
          }
          return {
            questions: session.questions,
            answers: session.answers,
            index: Math.max(0, Math.min(session.index, session.questions.length)),
            result: session.result || null,
            populationSize: Number.isFinite(session.populationSize) ? session.populationSize : 10000,
            savedAt: payload.savedAt || "",
            saveError: ""
          };
        } catch (error) {
          localStorage.removeItem(testStorageKey);
          return null;
        }
      },

      saveTestSession() {
        if (!this.testSession.questions.length || this.testSession.result) return false;
        try {
          const savedAt = new Date().toISOString();
          localStorage.setItem(testStorageKey, JSON.stringify({
            version: 1,
            savedAt,
            session: {
              questions: this.testSession.questions,
              index: this.testSession.index,
              answers: this.testSession.answers,
              result: this.testSession.result,
              populationSize: this.testSession.populationSize
            }
          }));
          this.testSession.savedAt = savedAt;
          this.testSession.saveError = "";
          this.renderTest();
          return true;
        } catch (error) {
          this.testSession.saveError = "Could not save this test. Browser storage may be full.";
          this.renderTest();
          return false;
        }
      },

      clearSavedTestSession() {
        localStorage.removeItem(testStorageKey);
      },

      writeDataStatus(message) {
        const status = document.getElementById("data-status");
        if (status) status.textContent = message;
      },

      exportProgress() {
        const blob = new Blob([core.serializeProgress(this.state)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "progress.json";
        if (document.body) document.body.appendChild(link);
        link.click();
        if (link.remove) link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        this.writeDataStatus("Progress exported to progress.json.");
      },

      async importProgress(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const nextState = core.parseProgress(await file.text());
          if (!this.saveState(nextState)) {
            this.writeDataStatus("Could not save imported progress. Current progress was not changed.");
            return;
          }
          this.state = nextState;
          this.passage = core.generatePassage(this.state);
          this.currentSentenceIndex = 0;
          this.guidedActive = false;
          this.selectedWordId = null;
          this.testSession = { questions: [], index: 0, answers: [], result: null };
          this.clearSavedTestSession();
          this.render();
          this.writeDataStatus("Progress imported.");
        } catch (error) {
          this.writeDataStatus("Invalid progress file.");
        } finally {
          event.target.value = "";
        }
      },

      resetProgress() {
        if (!window.confirm("Reset all local progress?")) return;
        localStorage.removeItem(storageKey);
        this.state = core.createDefaultState();
        this.passage = core.generatePassage(this.state);
        this.currentSentenceIndex = 0;
        this.guidedActive = false;
        this.showTranslation = false;
        this.selectedWordId = null;
        this.testSession = { questions: [], index: 0, answers: [], result: null };
        this.clearSavedTestSession();
        this.render();
        this.writeDataStatus("Local progress reset.");
      },

      showView(viewId) {
        document.querySelectorAll(".view").forEach((view) => {
          const active = view.id === viewId;
          view.hidden = !active;
          view.classList.toggle("is-active", active);
        });
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle("is-active", tab.dataset.view === viewId);
        });
        this.render();
      },

      render() {
        this.renderDashboard();
        this.renderPassage();
        const selectedWord = this.state.vocabulary.find((word) => word.id === this.selectedWordId);
        this.renderWordCard(selectedWord || null);
        this.renderStats();
        this.renderTest();
        document.getElementById("wpm-control").value = this.state.user.targetWpm;
        document.getElementById("wpm-value").textContent = this.state.user.targetWpm;
        document.getElementById("toggle-translation").textContent = this.showTranslation ? "Hide Chinese" : "Show Chinese";
      },

      renderDashboard() {
        const metrics = core.deriveMetrics(this.state);
        document.getElementById("dashboard").innerHTML = [
          ["Vocabulary", `${this.state.user.estimatedVocabulary}`],
          ["Mastered", metrics.masteredWords],
          ["Today", metrics.todayStudiedWords],
          ["WPM", this.state.user.targetWpm],
          ["New words", `${Math.round(this.state.user.newWordRatio * 100)}%`]
        ].map(([label, value]) => `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`).join("");
      },

      renderPassage() {
        document.getElementById("passage-title").textContent = this.passage.title;
        const targetIds = new Set(this.passage.targetWordIds);
        document.getElementById("passage").innerHTML = this.passage.sentences.map((sentence, sentenceIndex) => {
          const parts = sentence.split(/(\s+)/).map((part) => {
            const word = core.findWordByText(this.state, part);
            if (!word || !targetIds.has(word.id)) return core.escapeHtml(part);
            return `<button class="word-token status-${word.status}" data-word-id="${word.id}" type="button">${core.escapeHtml(part)}</button>`;
          }).join("");
          const activeClass = sentenceIndex === this.currentSentenceIndex ? "sentence-active" : "";
          return `<span class="sentence ${activeClass}" data-sentence-index="${sentenceIndex}">${parts}</span>`;
        }).join(" ");
        document.getElementById("translation").hidden = !this.showTranslation;
        document.getElementById("translation").textContent = this.passage.zh;
        document.querySelectorAll(".word-token").forEach((button) => {
          button.addEventListener("click", () => this.selectWord(Number(button.dataset.wordId)));
        });
      },

      selectWord(wordId) {
        const index = this.state.vocabulary.findIndex((word) => word.id === wordId);
        if (index < 0) return;
        this.state.vocabulary[index] = core.applyWordEvent(this.state.vocabulary[index], "click");
        this.selectedWordId = wordId;
        this.renderWordCard(this.state.vocabulary[index]);
        this.renderDashboard();
        this.renderPassage();
        this.saveState();
      },

      getEnglishVoice() {
        const synth = window.speechSynthesis;
        if (!synth || typeof synth.getVoices !== "function") return null;
        const voices = synth.getVoices();
        const englishVoices = voices.filter((voice) => String(voice.lang).toLowerCase().startsWith("en"));
        const scoreVoice = (voice) => {
          const name = `${voice.name} ${voice.voiceURI}`.toLowerCase();
          let score = voice.lang === "en-US" ? 20 : 0;
          if (/natural|neural|online|premium/.test(name)) score += 40;
          if (/microsoft|google|apple/.test(name)) score += 20;
          if (/jenny|aria|guy|samantha|daniel|ava|emma/.test(name)) score += 10;
          if (voice.localService === false) score += 5;
          return score;
        };
        return englishVoices.sort((a, b) => scoreVoice(b) - scoreVoice(a))[0]
          || null;
      },

      speak(text, onEnd) {
        const feedback = document.getElementById("reading-feedback");
        const synth = window.speechSynthesis;
        if (!synth || typeof window.SpeechSynthesisUtterance !== "function") {
          if (feedback) feedback.innerHTML = `<p class="muted">TTS unavailable in this browser.</p>`;
          if (onEnd) onEnd();
          return;
        }
        synth.cancel();
        const utterance = new window.SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = Math.min(1.05, core.mapWpmToRate(this.state.user.targetWpm));
        utterance.pitch = 1.05;
        utterance.volume = 1;
        const voice = this.getEnglishVoice();
        if (voice) utterance.voice = voice;
        if (onEnd) utterance.onend = onEnd;
        synth.speak(utterance);
      },

      speakPassage() {
        const sentences = [...this.passage.sentences];
        const speakNext = () => {
          const sentence = sentences.shift();
          if (!sentence) return;
          this.speak(sentence, () => window.setTimeout(speakNext, 350));
        };
        speakNext();
      },

      guidedReading() {
        if (!this.guidedActive) {
          this.currentSentenceIndex = 0;
          this.guidedActive = true;
        }
        this.currentSentenceIndex = Math.min(
          this.currentSentenceIndex,
          Math.max(0, this.passage.sentences.length - 1)
        );
        this.renderPassage();
        const sentence = this.passage.sentences[this.currentSentenceIndex] || "";
        this.speak(sentence, () => this.promptReadFeedback(sentence));
      },

      promptReadFeedback(sentence) {
        const feedback = document.getElementById("reading-feedback");
        if (!feedback) return;
        const unavailable = feedback.innerHTML.includes("TTS unavailable")
          ? `<p class="muted">TTS unavailable in this browser.</p>`
          : "";
        feedback.innerHTML = `${unavailable}<p class="muted">AI pronunciation assessment is listening...</p><p class="muted" id="speech-feedback"></p>`;
        this.trySpeechRecognition(sentence);
      },

      trySpeechRecognition(sentence) {
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) return null;
        const speechFeedback = document.getElementById("speech-feedback");
        const setSpeechFallback = (message) => {
          if (speechFeedback) speechFeedback.textContent = message;
        };
        const recognition = new Recognition();
        let receivedResult = false;
        recognition.lang = "en-US";
        recognition.onresult = (event) => {
          receivedResult = true;
          const transcript = event.results?.[0]?.[0]?.transcript || "";
          const similarity = core.textSimilarity(sentence, transcript);
          this.applyAutomaticReadingAssessment(sentence, transcript, similarity);
        };
        recognition.onerror = () => {
          setSpeechFallback("Speech recognition unavailable. Please try Start speaking again.");
        };
        recognition.onend = () => {
          if (!receivedResult) setSpeechFallback("No speech detected. Please read the sentence again.");
        };
        try {
          recognition.start();
        } catch (error) {
          setSpeechFallback("Could not start speech recognition. Please try again.");
        }
        return recognition;
      },

      createWaveform() {
        return `<div id="voice-wave" class="voice-wave" aria-label="Microphone input level">${Array.from({ length: 18 }, () => "<span></span>").join("")}</div>`;
      },

      stopMicrophoneMonitor() {
        const monitor = this.microphoneMonitor;
        if (!monitor) return;
        if (monitor.animationFrame) cancelAnimationFrame(monitor.animationFrame);
        monitor.stream?.getTracks?.().forEach((track) => track.stop());
        monitor.audioContext?.close?.();
        this.microphoneMonitor = null;
      },

      async startMicrophoneMonitor() {
        this.stopMicrophoneMonitor();
        const feedback = document.getElementById("speech-feedback");
        if (!navigator.mediaDevices?.getUserMedia || (typeof window.AudioContext !== "function" && typeof window.webkitAudioContext !== "function")) {
          if (feedback) feedback.textContent = "Microphone level is unavailable in this browser.";
          return null;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          const audioContext = new AudioContextClass();
          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;
          const source = audioContext.createMediaStreamSource(stream);
          source.connect(analyser);
          const samples = new Uint8Array(analyser.fftSize);
          const monitor = { stream, audioContext, analyser, samples, animationFrame: null };
          this.microphoneMonitor = monitor;
          const draw = () => {
            analyser.getByteTimeDomainData(samples);
            let total = 0;
            for (const value of samples) {
              const centered = value - 128;
              total += centered * centered;
            }
            const level = Math.min(1, Math.sqrt(total / samples.length) / 48);
            document.querySelectorAll("#voice-wave span").forEach((bar, index) => {
              const pulse = Math.abs(Math.sin((Date.now() / 140) + index));
              const height = 8 + Math.round(level * 42 * (0.45 + pulse * 0.55));
              bar.style.height = `${height}px`;
              bar.style.opacity = String(0.3 + level * 0.7);
            });
            monitor.animationFrame = requestAnimationFrame(draw);
          };
          draw();
          if (feedback) feedback.textContent = "Microphone is listening. Speak now.";
          return monitor;
        } catch (error) {
          if (feedback) feedback.textContent = "Microphone permission is required to show the voice wave.";
          return null;
        }
      },

      startSpeaking() {
        const sentence = this.passage.sentences[this.currentSentenceIndex] || this.passage.sentences[0] || "";
        const feedback = document.getElementById("reading-feedback");
        if (!feedback) return;
        feedback.innerHTML = `<p class="muted">Listening to your reading...</p>${this.createWaveform()}<p class="muted" id="speech-feedback"></p>`;
        this.startMicrophoneMonitor();
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const speechFeedback = document.getElementById("speech-feedback");
        if (!Recognition) {
          if (speechFeedback) speechFeedback.textContent = "Speech recognition unavailable. Please try again in a browser with speech recognition.";
          return;
        }
        const recognition = new Recognition();
        let receivedResult = false;
        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onresult = (event) => {
          receivedResult = true;
          const transcript = event.results?.[0]?.[0]?.transcript || "";
          const similarity = core.textSimilarity(sentence, transcript);
          this.applyAutomaticReadingAssessment(sentence, transcript, similarity);
        };
        recognition.onerror = () => {
          this.stopMicrophoneMonitor();
          if (speechFeedback) speechFeedback.textContent = "Speech recognition unavailable. Please try again.";
        };
        recognition.onend = () => {
          this.stopMicrophoneMonitor();
          if (!receivedResult) {
            const fallback = document.getElementById("speech-feedback");
            if (fallback) fallback.textContent = "No speech detected. Please read the sentence again.";
          }
        };
        try {
          recognition.start();
        } catch (error) {
          this.stopMicrophoneMonitor();
          if (speechFeedback) speechFeedback.textContent = "Could not start speech recognition. Please try again.";
        }
      },

      applyAutomaticReadingAssessment(sentence, transcript, similarity) {
        this.stopMicrophoneMonitor();
        const eventName = similarity >= 0.85 ? "readSmooth" : similarity >= 0.6 ? "readOkay" : "readDifficult";
        if (!["readSmooth", "readOkay", "readDifficult"].includes(eventName)) return;
        const sentenceTargetIds = core.getSentenceTargetWordIds(this.state, this.passage, this.currentSentenceIndex);
        const targetIds = new Set(sentenceTargetIds);
        this.state.vocabulary = this.state.vocabulary.map((word) => (
          targetIds.has(word.id) ? core.applyWordEvent(word, eventName) : word
        ));
        this.state.reading.lastAccuracy = similarity;
        this.recordReadingActivity(sentenceTargetIds);
        const hasNextSentence = this.currentSentenceIndex < this.passage.sentences.length - 1;
        this.currentSentenceIndex = Math.min(
          this.currentSentenceIndex + 1,
          Math.max(0, this.passage.sentences.length - 1)
        );
        if (!hasNextSentence) this.guidedActive = false;
        this.saveState();
        this.render();
        const feedback = document.getElementById("reading-feedback");
        if (feedback) {
          const label = eventName === "readSmooth" ? "strong" : eventName === "readOkay" ? "developing" : "needs review";
          feedback.innerHTML = hasNextSentence
            ? `<p class="muted">AI assessment: ${label} pronunciation, ${Math.round(similarity * 100)}% match.</p><p class="muted">Recognized: ${core.escapeHtml(transcript || "(no text)")}</p><button id="continue-reading" type="button">Continue</button>`
            : `<p class="muted">AI assessment complete: ${Math.round(similarity * 100)}% match. Session complete.</p><p class="muted">Recognized: ${core.escapeHtml(transcript || "(no text)")}</p>`;
          const continueButton = feedback.querySelector ? feedback.querySelector("#continue-reading") : null;
          if (continueButton) continueButton.addEventListener("click", () => this.guidedReading());
        }
      },

      recordReadingActivity(wordIds = []) {
        const todayKey = core.localDateKey ? core.localDateKey() : new Date().toISOString().slice(0, 10);
        const today = this.state.activity[todayKey] || { studiedWords: 0, readCount: 0 };
        if (!this.state.reading.studiedWordIdsByDay) this.state.reading.studiedWordIdsByDay = {};
        const studiedIds = new Set(this.state.reading.studiedWordIdsByDay[todayKey] || []);
        wordIds.forEach((wordId) => studiedIds.add(wordId));
        this.state.reading.studiedWordIdsByDay[todayKey] = [...studiedIds];
        today.studiedWords = studiedIds.size;
        today.readCount += 1;
        this.state.activity[todayKey] = today;
        this.state.reading.totalReadCount += 1;
      },

      renderWordCard(word) {
        const card = document.getElementById("word-card");
        if (!word) {
          card.innerHTML = `<p class="eyebrow">Word details</p><h2>Select a highlighted word</h2><p class="muted">Click a target word in the passage to inspect pronunciation, meaning, and example usage.</p>`;
          return;
        }
        card.innerHTML = `<p class="eyebrow">${core.escapeHtml(word.status)}</p><h2>${core.escapeHtml(word.word)}</h2><p>${core.escapeHtml(word.phonetic)} | ${core.escapeHtml(word.pos)}</p><p><strong>${core.escapeHtml(word.zh)}</strong></p><p>${core.escapeHtml(word.example)}</p><p class="muted">Known score: ${word.knownScore}/5 | Clicks: ${word.clickCount}</p>`;
      },

      renderStats() {
        const metrics = core.deriveMetrics(this.state);
        document.getElementById("stats-content").innerHTML = [
          ["Study days", this.state.user.streakDays],
          ["Total reads", this.state.reading.totalReadCount],
          ["Mastered", metrics.masteredWords],
          ["Learning", metrics.learningWords],
          ["Due review", metrics.dueReviewWords],
          ["Estimate", this.state.user.estimatedVocabulary]
        ].map(([label, value]) => `<div class="panel"><p class="eyebrow">${label}</p><h2>${value}</h2></div>`).join("");
      },

      async startTest() {
        if (this.assessmentWordBank.length < 10000) {
          this.assessmentWordBank = await this.loadAssessmentWordBank();
        }
        if (this.assessmentWordBank.length < 10000) {
          this.testSession = {
            questions: [],
            index: 0,
            answers: [],
            result: null,
            populationSize: 10000,
            loadError: "The 10,000-word assessment bank did not load. Please refresh the page and try again."
          };
          this.clearSavedTestSession();
          this.renderTest();
          return;
        }
        const wordBank = this.assessmentWordBank;
        this.testSession = {
          questions: core.createVocabularyTest(this.state, 500, wordBank),
          index: 0,
          answers: [],
          result: null,
          populationSize: 10000,
          savedAt: "",
          saveError: ""
        };
        this.clearSavedTestSession();
        this.renderTest();
      },

      answerTest(selectedOption) {
        const question = this.testSession.questions[this.testSession.index];
        if (!question) return;
        const known = typeof selectedOption === "boolean" ? selectedOption : selectedOption === question.word.zh;
        const wordIndex = this.state.vocabulary.findIndex((word) => word.id === question.word.id);
        if (wordIndex >= 0 && !question.word.rank) {
          this.state.vocabulary[wordIndex] = core.applyWordEvent(
            this.state.vocabulary[wordIndex],
            known ? "testCorrect" : "testWrong"
          );
        }
        this.testSession.answers[this.testSession.index] = {
          wordId: question.word.id,
          level: question.word.level,
          rank: question.word.rank || question.word.frequencyRank,
          known,
          selected: selectedOption
        };
        this.testSession.index += 1;
        if (this.testSession.index >= this.testSession.questions.length) {
          const completedAnswers = this.testSession.answers.slice(0, this.testSession.questions.length).filter(Boolean);
          const result = core.estimateVocabularyRange(completedAnswers, this.testSession.populationSize || 10000);
          this.testSession.result = result;
          Object.assign(this.state.user, result);
          this.clearSavedTestSession();
          this.state.tests.push({
            date: core.localDateKey(),
            answers: completedAnswers.map((answer) => ({ ...answer })),
            result: { ...result }
          });
        }
        this.saveState();
        this.render();
      },

      previousTestQuestion() {
        if (!this.testSession.questions.length || this.testSession.index <= 0) return;
        this.testSession.result = null;
        this.testSession.index -= 1;
        this.renderTest();
      },

      playTestPronunciation() {
        const question = this.testSession.questions[this.testSession.index];
        if (!question) return;
        this.speak(question.word.word);
      },

      renderTest() {
        const content = document.getElementById("test-content");
        if (!content) return;
        if (this.testSession.result) {
          content.innerHTML = `<p class="eyebrow">Result</p><h3>${this.testSession.result.estimatedVocabulary} words</h3><p class="muted">Correct: ${this.testSession.result.correctCount} of ${this.testSession.result.totalQuestions}. 95% confidence interval: ${core.escapeHtml(this.testSession.result.rangeLabel)} words.</p><p class="muted">${core.escapeHtml(this.testSession.result.method)}</p>`;
          return;
        }
        const question = this.testSession.questions[this.testSession.index];
        if (!question) {
          const sourceCount = this.assessmentWordBank.length;
          const message = this.testSession.loadError
            ? this.testSession.loadError
            : `Start a 500-question objective test. The app randomly samples without replacement from ${sourceCount} frequency-ranked daily words and estimates vocabulary size from the correct-answer proportion.`;
          content.innerHTML = `<p class="muted">${core.escapeHtml(message)}</p>`;
          return;
        }
        const previousAnswer = this.testSession.answers[this.testSession.index]?.selected;
        const savedText = this.testSession.saveError
          ? `<p class="muted">${core.escapeHtml(this.testSession.saveError)}</p>`
          : this.testSession.savedAt
            ? `<p class="muted">Saved. You can return later and continue from this question.</p>`
            : "";
        const phonetic = question.word.phonetic && question.word.phonetic !== "NULL"
          ? `<p class="muted">${core.escapeHtml(question.word.phonetic)}</p>`
          : `<p class="muted">Phrase pronunciation</p>`;
        content.innerHTML = `<p class="eyebrow">Objective vocabulary assessment</p><p class="muted">Question ${this.testSession.index + 1} of ${this.testSession.questions.length}</p><h3>${core.escapeHtml(question.word.word)}</h3>${phonetic}<button id="play-test-pronunciation" type="button">Play pronunciation</button><div class="button-grid">${question.options.map((option) => `<button class="test-option" type="button" data-option="${core.escapeHtml(option)}">${option === previousAnswer ? "Selected: " : ""}${core.escapeHtml(option)}</button>`).join("")}</div><div class="button-grid"><button id="previous-question" type="button" ${this.testSession.index <= 0 ? "disabled" : ""}>Previous</button><button id="save-test" type="button">Save test</button></div>${savedText}`;
        document.querySelectorAll(".test-option").forEach((button) => {
          button.addEventListener("click", () => this.answerTest(button.dataset.option));
        });
        document.getElementById("play-test-pronunciation")?.addEventListener("click", () => this.playTestPronunciation());
        document.getElementById("previous-question")?.addEventListener("click", () => this.previousTestQuestion());
        document.getElementById("save-test")?.addEventListener("click", () => this.saveTestSession());
      }
    };

    window.CVT.app = app;
    document.addEventListener("DOMContentLoaded", () => app.init());
  </script>
</body>
</html>
